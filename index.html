<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16171c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PG CARD">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="description" content="Pilih layanan PG CARD Pakuwon Mall Solo Baru.">
  <title>PG CARD | Pakuwon Mall Solo Baru</title>
  <style>
    :root { --pg-red: #e9252e; --white: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { background: #16171c; }
    body {
      min-height: 100vh; min-height: 100svh; display: flex;
      justify-content: center; align-items: stretch; padding: 0;
      background: #16171c; font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      position: relative; isolation: isolate; overflow: hidden; width: 100%;
      min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column;
      align-items: center; text-align: center;
      padding: clamp(34px, 6vh, 68px) clamp(22px, 5vw, 72px) clamp(26px, 4vh, 48px);
      background: #68717d url("background-mall-responsive.png") center center / cover no-repeat;
    }
    .page::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(180deg, rgba(14,20,32,.31) 0%, rgba(14,20,32,.20) 45%, rgba(14,20,32,.40) 100%);
    }
    .content { width: min(100%, 560px); display: flex; flex-direction: column; align-items: center; flex: 1; }
    .brand { width: clamp(175px, 48vw, 285px); margin: 0 0 clamp(42px, 8vh, 76px); padding: 0; background: transparent; box-shadow: none; }
    .brand img { display: block; width: 100%; height: auto; object-fit: contain; background: transparent; border: 0; box-shadow: none; }
    .eyebrow {
      color: #fff; margin: 0 0 clamp(26px, 4vh, 38px);
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      font-size: clamp(17px, 2.2vw, 23px); font-weight: 800;
      letter-spacing: clamp(1.5px, .3vw, 3px); line-height: 1.45;
      text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.72);
    }
    .eyebrow::after { content: ""; display: block; width: 42px; height: 3px; border-radius: 5px; background: #fff; margin: 12px auto 0; opacity: .9; }
    .actions { width: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(16px, 2.5vh, 24px); }
    .action {
      display: flex; align-items: center; justify-content: center; width: min(100%, 360px);
      min-height: clamp(50px, 6vw, 58px); padding: 15px 22px;
      border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
      background: var(--pg-red); color: var(--white); text-decoration: none;
      font-size: clamp(14px, 1.3vw, 17px); line-height: 1.25; font-weight: 800;
      letter-spacing: .35px; box-shadow: 0 8px 22px rgba(99,8,14,.30);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .action:hover, .action:focus-visible { background: #c91e27; transform: translateY(-3px); box-shadow: 0 12px 26px rgba(99,8,14,.38); outline: none; }
    .install-button {
      display:none; align-items:center; justify-content:center; gap:9px;
      width:min(100%,360px); min-height:48px; margin-top:18px; padding:13px 20px;
      border:1px solid rgba(255,255,255,.82); border-radius:999px;
      color:#fff; background:rgba(22,23,28,.72); font-size:14px; font-weight:800;
      letter-spacing:.35px; cursor:pointer; box-shadow:0 8px 22px rgba(0,0,0,.22);
      backdrop-filter:blur(8px); -webkit-tap-highlight-color:transparent;
    }
    .install-button:hover,.install-button:focus-visible { background:#16171c; outline:2px solid #fff; outline-offset:3px; }
    .install-button.is-visible { display:flex; }
    .install-note { display:none; max-width:340px; margin:10px auto 0; color:#fff; font-size:12px; line-height:1.5; text-shadow:0 2px 8px #000; }
    .install-note.is-visible { display:block; }
    .contact { margin-top: clamp(28px, 4vh, 42px); color: rgba(255,255,255,.94); font-size: clamp(12px,1.15vw,15px); line-height: 1.6; text-align: center; text-shadow: 0 2px 9px rgba(0,0,0,.75); }
    .contact-label { display: block; margin-bottom: 4px; font-weight: 700; letter-spacing: .35px; }
    .contact a { color: #fff; text-decoration: underline; text-decoration-color: rgba(255,255,255,.7); text-underline-offset: 3px; overflow-wrap: anywhere; }
    .contact a:hover, .contact a:focus-visible { color: #ffd9d9; outline: none; }
    .tagline { margin-top: auto; padding-top: clamp(42px,8vh,76px); color: #fff; font-size: clamp(15px,1.5vw,18px); font-style: italic; letter-spacing: .25px; text-shadow: 0 2px 9px rgba(0,0,0,.75); }
    .footer-mark { width: 34px; height: 3px; border-radius: 10px; background: var(--pg-red); margin: 14px auto 0; }
    @media (min-width:768px) {
      .page { justify-content: center; background-position: center 54%; }
      .content { width: min(100%,620px); justify-content: center; }
      .brand { width: clamp(230px,24vw,330px); margin-bottom: clamp(38px,6vh,62px); }
      .eyebrow { margin-bottom: 32px; }
      .action { width: min(100%,380px); }
      .tagline { padding-top: 50px; }
    }
    @media (min-width:1200px) { .page { background-position: center 56%; } .content { width: 650px; } }
    @media (max-height:620px) {
      .page { padding-top:24px; padding-bottom:22px; }
      .brand { width:clamp(145px,26vh,220px); margin-bottom:22px; }
      .eyebrow { margin-bottom:18px; }
      .actions { gap:14px; }
      .action { min-height:46px; }
      .tagline { padding-top:24px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; } }
  </style>
</head>
<body>
  <main class="page" aria-label="Layanan PG CARD">
    <div class="content">
      <header class="brand">
        <img src="logo-pg-card-white-transparent.png" alt="PG CARD">
      </header>
      <p class="eyebrow">PICK OUR SERVICES</p>
      <nav class="actions" aria-label="Pilih layanan">
        <a class="action" href="https://script.google.com/macros/s/AKfycbwk2UMQU6LMWNhbe40TMGjjxPqNIpMJqyYuEfrIR5VVhtK3w2wN-U6aedPuK5dcM3y_/exec" target="_blank" rel="noopener noreferrer">GET YOUR PG CARD</a>
        <a class="action" href="https://script.google.com/macros/s/AKfycbxJ3IrY1K3gsuTtPwfceEjOyF5NMq95ncokcqI_5nDDJj1Jubau1aWT5BgOQjm0ey-f4w/exec" target="_blank" rel="noopener noreferrer">UPLOAD BUKTI BAYAR</a>
        <a class="action" href="./tenant.html">TENANT PARTICIPANT PG</a>
        <a class="action" href="./promo.html">PROMO &amp; BENEFIT</a>
        <a class="action" href="./merchandise.html">MERCHANDISE PG CARD</a>
        <a class="action" href="./bantuan.html">PUSAT BANTUAN</a>
      </nav>
      <button class="install-button" id="installApp" type="button" aria-label="Instal aplikasi PG CARD">＋ INSTALL PG CARD</button>
      <p class="install-note" id="installNote" role="status"></p>
      <div class="contact">
        <span class="contact-label">CONTACT CUSTOMER SERVICE</span>
        <a href="mailto:cspakuwonsolobaru@gmail.com">cspakuwonsolobaru@gmail.com</a>
      </div>
    </div>
    <footer class="tagline">
      We Value Your Loyalty
      <div class="footer-mark" aria-hidden="true"></div>
    </footer>
  </main>
  <script>
    (() => {
      const installButton = document.getElementById('installApp');
      const installNote = document.getElementById('installNote');
      let installPrompt = null;
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const showButton = () => installButton.classList.add('is-visible');
      if (!isStandalone) showButton();
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault(); installPrompt = event; showButton();
      });
      installButton.addEventListener('click', async () => {
        installNote.classList.remove('is-visible');
        if (isStandalone) {
          installNote.textContent = 'PG CARD sudah terpasang di perangkat ini.';
          installNote.classList.add('is-visible'); return;
        }
        if (installPrompt) {
          installPrompt.prompt();
          const choice = await installPrompt.userChoice;
          if (choice && choice.outcome === 'accepted') {
            installButton.classList.remove('is-visible');
          }
          installPrompt = null; return;
        }
        if (isIOS) {
          installNote.textContent = 'Untuk memasang di iPhone: tekan tombol Bagikan di Safari, lalu pilih “Tambahkan ke Layar Utama”.';
        } else {
          installNote.textContent = 'Jika opsi instal belum muncul, buka menu browser (⋮ atau Bagikan) lalu pilih “Install app” atau “Tambahkan ke layar utama”. Pastikan website sudah diperbarui dan dibuka melalui HTTPS.';
        }
        installNote.classList.add('is-visible');
      });
      window.addEventListener('appinstalled', () => {
        installButton.classList.remove('is-visible');
        installNote.textContent = 'PG CARD berhasil dipasang.'; installNote.classList.add('is-visible');
      });
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
      }
    })();
  </script>
</body>
</html>
