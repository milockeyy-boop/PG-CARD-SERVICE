<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16171c">
  <meta name="description" content="Pilih layanan PG CARD Pakuwon Mall Solo Baru.">
  <title>PG CARD | Pakuwon Mall Solo Baru</title>
  <style>
    :root { --pg-red: #e9252e; --white: #fff; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #16171c; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      justify-content: center; align-items: center; padding: 12px;
      background: #16171c; font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      position: relative; isolation: isolate; overflow: hidden;
      width: min(100%, 455px); min-height: min(96vh, 850px);
      min-height: min(96svh, 850px);
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: clamp(32px, 6vh, 54px) 26px 30px;
      background: #68717d url("background-mall-v2.png") center center / cover no-repeat;
      box-shadow: 0 18px 50px rgba(0,0,0,.34);
      border: 1px solid rgba(255,255,255,.12);
    }
    /* Foto asli tetap terlihat jelas, hanya diberi tint tipis agar teks mudah dibaca. */
    .page::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(
        180deg,
        rgba(14, 20, 32, .25) 0%,
        rgba(14, 20, 32, .16) 42%,
        rgba(14, 20, 32, .35) 100%
      );
    }
    .brand {
      width: min(72%, 255px);
      margin: 0 0 clamp(44px, 8vh, 72px);
      padding: 0;
      background: none !important;
      box-shadow: none !important;
      border: 0 !important;
      border-radius: 0 !important;
    }
    .brand img {
      display: block; width: 100%; height: auto; object-fit: contain;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }
    .eyebrow {
      color: #fff; margin: 0 0 30px;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      font-size: clamp(17px, 4.3vw, 20px); font-weight: 800;
      letter-spacing: 2.4px; line-height: 1.45;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,.72);
    }
    .eyebrow::after {
      content: ""; display: block; width: 42px; height: 3px;
      border-radius: 5px; background: #fff; margin: 12px auto 0;
      opacity: .85;
    }
    .actions {
      width: 100%; display: flex; flex-direction: column;
      align-items: center; gap: 22px;
    }
    .action {
      display: flex; align-items: center; justify-content: center;
      width: min(100%, 290px); min-height: 54px; padding: 15px 20px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px; background: var(--pg-red); color: var(--white);
      text-decoration: none; font-size: 15px; line-height: 1.25;
      font-weight: 800; letter-spacing: .35px;
      box-shadow: 0 8px 22px rgba(99, 8, 14, .30);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .action:hover, .action:focus-visible {
      background: #c91e27; transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(99, 8, 14, .38); outline: none;
    }
    .action:active { transform: translateY(0); }
    .tagline {
      margin-top: auto; padding-top: 44px; color: #fff;
      font-size: 16px; font-style: italic; letter-spacing: .25px;
      text-shadow: 0 2px 9px rgba(0,0,0,.7);
    }
    .footer-mark {
      width: 34px; height: 3px; border-radius: 10px;
      background: var(--pg-red); margin: 14px auto 0;
      box-shadow: 0 1px 8px rgba(0,0,0,.15);
    }
    @media (max-height: 620px) {
      .page { min-height: 620px; }
      .brand { margin-bottom: 28px; }
      .actions { gap: 16px; }
      .tagline { padding-top: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Layanan PG CARD">
    <header class="brand">
      <img src="logo-pg-card-transparent-v2.png" alt="PG CARD">
    </header>
    <p class="eyebrow">PICK OUR SERVICE'S</p>
    <nav class="actions" aria-label="Pilih layanan">
      <a class="action"
         href="https://script.google.com/macros/s/AKfycbwk2UMQU6LMWNhbe40TMGjjxPqNIpMJqyYuEfrIR5VVhtK3w2wN-U6aedPuK5dcM3y_/exec"
         target="_blank" rel="noopener noreferrer">GET YOUR PG CARD</a>
      <a class="action"
         href="https://script.google.com/macros/s/AKfycbxJ3IrY1K3gsuTtPwfceEjOyF5NMq95ncokcqI_5nDDJj1Jubau1aWT5BgOQjm0ey-f4w/exec"
         target="_blank" rel="noopener noreferrer">UPLOAD BUKTI BAYAR</a>
    </nav>
    <footer class="tagline">
      We Value Your Loyalty
      <div class="footer-mark" aria-hidden="true"></div>
    </footer>
  </main>
</body>
</html>
